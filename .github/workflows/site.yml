# Met le site (dossier « Site web ») en ligne sur GitHub Pages à chaque envoi.

name: Site

on:
  push:
    branches: [main]
    paths: ["Site web/**", ".github/workflows/site.yml"]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  deploy:
    runs-on: ubuntu-22.04
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - uses: actions/checkout@v4
      - name: Fichiers du site (sans les outils de test)
        run: |
          mkdir _site
          rsync -a --exclude tools --exclude README.md "Site web/" _site/
      - uses: actions/configure-pages@v5
      - uses: actions/upload-pages-artifact@v3
        with:
          path: _site
      - id: deployment
        uses: actions/deploy-pages@v4
